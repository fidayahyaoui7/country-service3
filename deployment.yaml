
apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-country-service-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: country-service
  template:
    metadata:
      labels:
        app: country-service
    spec:
      containers:
        - name: country-service
          image: fidayahyaoui/my-country-service3:8
          imagePullPolicy: Always
          ports:
            - containerPort: 8082
              protocol: TCP
