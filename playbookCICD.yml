---
- name: Build and Deploy Docker Image to Kubernetes
  hosts: localhost 
  connection: local

  vars:
    image_name: my-country-service3
    image_tag: "7"
    dockerfile_path: './'
    docker_registry_username: fidayahyaoui
    docker_registry_password: dckr_pat_r4N31yvpR01JjZIOF-Wjwutmd7E

  tasks:
    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: fidayahyaoui
        password: fidayh2020
        reauthorize: yes

    - name: Build Docker image
      docker_image:
        build:
          path: './'
        name: "{{ docker_registry_username }}/{{ image_name }}:{{ image_tag }}"
        source: build
        state: present
        tag: "{{ image_tag }}"

    - name: Push the Docker image to Docker Hub
      docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}:{{ image_tag }}"
        tag: "{{ image_tag }}"
        push: yes
        source: local

    - name: Pull Docker image (optional, for verification or on target nodes)
      docker_image:
        name: "{{ docker_registry_username }}/{{ image_name }}:{{ image_tag }}"
        tag: "{{ image_tag }}"
        source: pull

    - name: Apply Kubernetes Deployment
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        src: deployment.yaml
        kubeconfig: config

    - name: Apply Kubernetes Service
      kubernetes.core.k8s:
        state: present
        namespace: jenkins
        src: service.yaml
        kubeconfig: config
