---
- name: Build, push et deploiement de country-service3
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - vault.yml
  vars:
    image_name: "fidayahyaoui/my-country-service3"
    image_tag: "v{{ lookup('env', 'BUILD_NUMBER') | default('latest', true) }}"
    workdir: "{{ lookup('env', 'WORKSPACE') | default(playbook_dir, true) }}"

  tasks:
    - name: Construire l'image Docker
      ansible.builtin.command: docker build -t {{ image_name }}:{{ image_tag }} .
      args:
        chdir: "{{ workdir }}"

    - name: Se connecter a Docker Hub (identifiants du vault)
      ansible.builtin.shell: echo "$DP" | docker login -u "{{ docker_user }}" --password-stdin
      environment:
        DP: "{{ docker_pass }}"
      no_log: true

    - name: Pousser l'image sur Docker Hub
      ansible.builtin.command: docker push {{ image_name }}:{{ image_tag }}

    - name: Appliquer deployment.yaml avec la nouvelle image
      ansible.builtin.shell: sed "s|IMAGE_PLACEHOLDER|{{ image_name }}:{{ image_tag }}|" deployment.yaml | kubectl apply -f -
      args:
        chdir: "{{ workdir }}"

    - name: Attendre que les 3 pods soient prets
      ansible.builtin.command: kubectl rollout status deployment/my-country-service3 --timeout=180s

    - name: Lister les pods
      ansible.builtin.command: kubectl get pods -l app=country-service3
      register: pods

    - name: Afficher les pods
      ansible.builtin.debug:
        var: pods.stdout_lines
