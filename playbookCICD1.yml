
---
- name: Build and Deploy Docker Container
  hosts: localhost
  connection: local

  vars_files:
    - vault.yml

  vars:
    image_name: my-country-service3
    image_tag: "8"
    dockerfile_path: "./"
    host_port: 8085
    container_port: 8082

  tasks:

    - name: Log in to Docker Hub
      community.docker.docker_login:
        username: "{{ dockerhub_username }}"
        password: "{{ dockerhub_password }}"
        reauthorize: yes

    - name: Build Docker image without cache
      ansible.builtin.command:
        argv:
          - docker
          - build
          - --no-cache
          - --pull
          - -t
          - "{{ dockerhub_username }}/{{ image_name }}:{{ image_tag }}"
          - "{{ dockerfile_path }}"
      register: docker_build

    - name: Display Docker build result
      ansible.builtin.debug:
        var: docker_build.stdout_lines

    - name: Push new image to Docker Hub
      ansible.builtin.command:
        argv:
          - docker
          - push
          - "{{ dockerhub_username }}/{{ image_name }}:{{ image_tag }}"
      register: docker_push
      changed_when: true

    - name: Display Docker push result
      ansible.builtin.debug:
        var: docker_push.stdout_lines

    - name: Stop and replace old container
      community.docker.docker_container:
        name: country-service
        image: "{{ dockerhub_username }}/{{ image_name }}:{{ image_tag }}"
        image_name_mismatch: recreate
        state: started
        recreate: yes
        restart_policy: always
        ports:
          - "{{ host_port }}:{{ container_port }}"

    - name: Verify running container
      ansible.builtin.command:
        argv:
          - docker
          - ps
          - --filter
          - name=country-service
      register: container_status
      changed_when: false

    - name: Display container status
      ansible.builtin.debug:
        var: container_status.stdout_lines
